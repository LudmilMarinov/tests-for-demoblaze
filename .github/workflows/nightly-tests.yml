name: Nightly Playwright Tests

on:
  schedule:
    # Runs at 02:00 UTC every day. Adjust to your timezone as needed
    # (Ireland is UTC in winter, UTC+1 in summer/BST)
    - cron: '0 2 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          # add any base URLs / API keys / secrets your suite needs, e.g.:
          # BASE_URL: ${{ vars.BASE_URL }}
          # API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Upload HTML report
        if: always() # upload even if tests fail, so you can see why
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
